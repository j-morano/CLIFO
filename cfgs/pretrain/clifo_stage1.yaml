# Input and output tasks
in_domains: bscan-bscanlayermap
out_domains: bscan-bscanlayermap
extra_norm_pix_loss: False

# Architecture
model: pretrain_clifo_base
decoder_dim: 256
input_size:
  bscan: [512, 512]
  bscanlayermap: [128, 128]
patch_size:
  bscan: [32, 32]
  bscanlayermap: [8, 8]
alphas: 1.0  # Dirichlet concentration parameter
num_encoded_tokens: 64 # Total would be 196 * 3 patches. 196 / 2 = 98
num_global_tokens: 10
decoder_use_task_queries: True
decoder_depth: 2
sample_only: 'bscan'
weights: '_weights/MIRAGE-Base.pth'  # initialisation: pretrained MIRAGE ViT-B/32

# Train
epochs: 100
opt: adamw
blr: 0.0001 # this is base_lr = 1e-4, lr = base_lr * batch_size / 256
warmup_lr: 0.000001 # 1e-6
min_lr: 0.
warmup_epochs: 10
batch_size: 1024
hflip: 0.5
vflip: 0.0
loss_on_unmasked: False
save_ckpt_freq: 5
repeat_dataset: 100
intensity_shift: 0.05
filelist: ./cfgs/training_databank.joblib  # list of the pretraining files (not released)

# Data
data_path: '/path/to/pretraining_data/'  # folder with the pretraining B-scans and layer maps (not released)

# Wandb logging
log_wandb: False # Set to True to log to Weights & Biases
wandb_project: 'multimae-pretrain'
wandb_entity: null # Change if needed
